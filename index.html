<!DOCTYPE html>
<html lang="so" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimmah Pro</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding-bottom: 70px; direction: ltr; }
        .top-header { background: #064e3b; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 480px; margin: auto; background: white; padding: 15px; border-radius: 8px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section-title { font-size: 15px; color: #064e3b; font-weight: bold; margin-bottom: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #064e3b; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #022c22; }
        .btn-danger { background: #ef4444; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 8px 0; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; color: #666; text-decoration: none; font-size: 12px; }
        .nav-item.active { color: #064e3b; font-weight: bold; }
        .card-info { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; font-size: 13px; color: #166534; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="top-header">
        <div>
            <span style="font-size: 16px; font-weight: bold;">Zimmah Pro</span>
            <div style="font-size: 11px; opacity: 0.8;">Nidaamka Maaliyadda & Deymaha</div>
        </div>
        <div style="background: #047857; padding: 4px 8px; border-radius: 4px; font-size: 11px;">v2.5</div>
    </div>

    <div class="container" id="main-content">
        <!-- قسم الإعدادات والأمان الرئيسي (Dejinta) -->
        <div class="section-title">Dejinta & Ammaanka</div>
        
        <div class="card-info">
            ⚡ <b>AI-Ready Architecture:</b> الهوية البرمجية والتطوير المستمر - المهندس: محسن / عبد الخبير. قابلية التوسع كلياً للحقن الذكي.
        </div>

        <label>Lambarka Dukaanadaada (EVC Plus):</label>
        <input type="text" id="storePhone" placeholder="مثال: 25261xxxxxxx" value="613938202">

        <label>Lambarka Xisaabta Bangiga (Ikhtiyaari):</label>
        <input type="text" id="bankAccount" placeholder="أو رقم الحساب البنكي IBAN">

        <label>Luuqadda:</label>
        <select id="langSelect">
            <option value="Soomaali">Soomaali (الصومالية)</option>
            <option value="Arabic">العربية</option>
        </select>

        <button onclick="saveSettings()">Beddel Lambarka Sireed (PIN)</button>
        <button onclick="clearData()" class="btn-danger">Tirtir Dhammaan Xogta</button>
    </div>

    <!-- شريط التنقل السفلي الأصلي -->
    <div class="bottom-nav">
        <a href="#" class="nav-item" onclick="switchTab('hoyga')">
            <div>🏠</div>
            <div>Hoyga</div>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('macamiisha')">
            <div>👥</div>
            <div>Macamiisha</div>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('pro')">
            <div>⭐</div>
            <div>Pro</div>
        </a>
        <a href="#" class="nav-item active" onclick="switchTab('dejinta')">
            <div>⚙️</div>
            <div>Dejinta</div>
        </a>
    </div>

    <script>
        function saveSettings() {
            let phone = document.getElementById('storePhone').value;
            localStorage.setItem('zimmah_store_phone', phone);
            alert('Waa la keydiyay xogta guul! (تم حفظ الإعدادات بنجاح)');
        }

        function clearData() {
            if(confirm('Ma hubtaa inaad tirtirto xogta?')) {
                localStorage.clear();
                alert('Waa la tirtiray xogta.');
            }
        }

        function switchTab(tabName) {
            let content = document.getElementById('main-content');
            if(tabName === 'dejinta') {
                content.innerHTML = `
                    <div class="section-title">Dejinta & Ammaanka</div>
                    <label>Lambarka Dukaanadaada (EVC Plus):</label>
                    <input type="text" id="storePhone" value="${localStorage.getItem('zimmah_store_phone') || '613938202'}">
                    <button onclick="saveSettings()">Keydi Isbedelka</button>
                    <button onclick="clearData()" class="btn-danger">Tirtir Dhammaan Xogta</button>
                `;
            } else if(tabName === 'hoyga') {
                content.innerHTML = `<div class="section-title">Hoyga - Dashboard</div><p>Soo dhawoow تطبيق زمة برو الأساسي لإدارة المتاجر.</p>`;
            } else if(tabName === 'macamiisha') {
                content.innerHTML = `<div class="section-title">Macamiisha - Dejinta Deymaha</div><p>قائمة الزبائن والديون المسجلة.</p>`;
            } else if(tabName === 'pro') {
                content.innerHTML = `<div class="section-title">Zimmah Pro VIP</div><p>ميزات التاجر الماسي والتقارير المتقدمة وتصدير Excel/PDF.</p>`;
            }
        }
    </script>
</body>
</html>
