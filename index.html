<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimmah Pro - دفتر الديون الذكي v1.1.0</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 420px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        .badge { text-align: center; font-size: 11px; background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 10px; display: inline-block; margin: 0 auto 15px auto; width: fit-content; }
        .section { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
        input, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .btn-secondary { background: #0284c7; }
        .btn-secondary:hover { background: #0369a1; }
        .btn-vip { background: #d97706; }
        .btn-vip:hover { background: #b45309; }
        p { font-size: 13px; color: #666; margin: 0 0 10px 0; }
    </style>
</head>
<body>

<div class="container" style="text-align: center;">
    <h2>Zimmah Pro 💼</h2>
    <div class="badge">الإصدار الخارق v1.1.0 - برو والميزات المدفوعة</div>
    <p>الأمان المزدوج والخدمات التجارية المتقدمة</p>

    <!-- قسم الأمان والنسخ الاحتياطي الذكي -->
    <div class="section" style="text-align: right;">
        <h3 style="font-size: 15px; color: #333; margin-bottom: 5px;">حماية وحفظ الديون سحابياً 🔒</h3>
        <p>اربط رقم هاتفك ومفتاح الاستعادة لضمان عدم ضياع الديون.</p>
        <input type="tel" id="backupPhone" placeholder="رقم الهاتف (مثال: 61xxxxxxx)">
        <input type="text" id="recoveryKey" placeholder="مفتاح الطوارئ السري">
        <button onclick="saveAdvancedBackup()">حفظ وربط الحساب بأمان</button>
        <button onclick="restoreAccount()" class="btn-secondary">استعادة البيانات لجهاز جديد</button>
    </div>

    <!-- قسم الميزات المدفوعة والترقية الماسية (VIP) -->
    <div class="section" style="text-align: right; border: 1.5px solid #f59e0b;">
        <h3 style="font-size: 15px; color: #d97706; margin-bottom: 5px;">ميزات التاجر الماسي المدفوعة ⭐</h3>
        <p>احصل على تقارير محاسبية شاملة ومزامنة تلقائية سحابية متقدمة.</p>
        
        <button onclick="upgradeToVip()" class="btn-vip">ترقية الحساب إلى باقة VIP (مدفوع)</button>
        <button onclick="exportAccountingReport()" class="btn-vip" style="background: #b45309;">تصدير تقرير المحاسبة (PDF / Excel)</button>
    </div>
</div>

<script>
function saveAdvancedBackup() {
    var phone = document.getElementById('backupPhone').value.trim();
    var key = document.getElementById('recoveryKey').value.trim();
    if(phone.length < 7 || key.length < 4) {
        alert('الرجاء إدخال رقم هاتف صحيح ومفتاح سري آمن لا يقل عن 4 خانات.');
        return;
    }
    var currentLedgerData = localStorage.getItem('zimmah_ledger_data') || '{"debts": []}';
    var securePackage = { phone: phone, recoveryKey: key, timestamp: new Date().toISOString(), data: currentLedgerData };
    localStorage.setItem('zimmah_secure_vault', JSON.stringify(securePackage));
    localStorage.setItem('zimmah_user_phone', phone);
    alert('تم تأمين وحفظ دفتر الديون بنجاح!\nرقم الهاتف المرتبط: ' + phone);
}

function restoreAccount() {
    var phone = prompt('أدخل رقم الهاتف المرتبط بالحساب لاستعادة البيانات:');
    var key = prompt('أدخل مفتاح الطوارئ السري الخاص بك:');
    var savedVault = localStorage.getItem('zimmah_secure_vault');
    if(!savedVault) { alert('لا توجد بيانات محفوظة محلياً.'); return; }
    var vaultData = JSON.parse(savedVault);
    if(vaultData.phone === phone && vaultData.recoveryKey === key) {
        localStorage.setItem('zimmah_ledger_data', vaultData.data);
        alert('تمت استعادة دفتر الديون بنجاح تام!');
    } else {
        alert('خطأ في بيانات المطابقة (رقم الهاتف أو المفتاح السري غير صحيح).');
    }
}

// الدوال الخاصة بالميزات المدفوعة
function upgradeToVip() {
    alert('مرحباً بك في نظام الترقية المدفوعة لـ Zimmah Pro!\nسيتم توجيه التاجر لإتمام الاشتراك الرمزي وتفعيل الصلاحيات الماسية الكاملة.');
    localStorage.setItem('zimmah_vip_status', 'active');
}

function exportAccountingReport() {
    var isVip = localStorage.getItem('zimmah_vip_status');
    if(!isVip) {
        alert('هذه الميزة مخصصة لمشتركي باقة VIP. يرجى ترقية الحساب أولاً للاستفادة من التصدير الاحترافي.');
        return;
    }
    alert('جاري إعداد وتصدير التقارير المحاسبية الرسمية للدفتر بنجاح...');
}
</script>

</body>
</html>
